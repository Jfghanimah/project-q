{% comment %}
  Renders a follow/unfollow button.
  Expects `target_user` and `is_following` (boolean) in the context.
{% endcomment %}
<button
  class="btn btn-sm follow-toggle {% if is_following %}btn-following{% else %}btn-follow{% endif %}"
  data-action-url="{% url 'user-follow-unfollow' target_user.username %}"
  data-state="{% if is_following %}following{% else %}not_following{% endif %}">
  {% if is_following %}Following{% else %}Follow{% endif %}
</button>
